services:
  - type: web
    name: donojob
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python server.py"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Your master key. Render makes a random one; read it in the Environment tab.
      - key: OWNER_KEY
        generateValue: true
      # Names of friends whose keys should stop working, comma separated.
      - key: REVOKED
        value: ""
      # Turns on the AI follow check on the key page. Paste your key from
      # console.anthropic.com in the Render dashboard; it is never stored in the repo.
      - key: ANTHROPIC_API_KEY
        sync: false
